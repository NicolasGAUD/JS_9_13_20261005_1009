<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Restyle</title>
    <!-- Balise style contenant les classes pour la Partie 3 -->
    <style>
        .box-highlight {
            background-color: yellow;
            height: 300px;
            width: 400px;
        }
        .title-highlight {
            font-size: 60px;
            text-align: center;
            color: lightblue;
        }

    <!-- On charge le script avec defer pour que le HTML soit bien lisible -->

    <div class="box">
        <h1 class="title">Mon Titre</h1>
    </div>
</body>
</html>
